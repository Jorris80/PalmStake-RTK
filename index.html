<!DOCTYPE html>
<html lang="id">
<head>
<base target="_top">

<title>PalmStake RTK</title>
<link rel="manifest" href="manifest.json"><link rel="icon" href="icon.svg"><link rel="apple-touch-icon" href="icon.svg"><meta name="theme-color" content="#0f3d2e">
<link rel="preconnect" href="https://unpkg.com">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin="">
<style>
:root{--pri:#0f6e4f;--pri-d:#0a4d37;--pri-l:#e6f4ee;--acc:#d4a017;--bg:#f4f6f5;--card:#fff;--tx:#17231e;--mut:#64748b;--line:#e3e8e6;--sb:#0f2e24;--sb-tx:#d9ece4;--sb-act:#1c5a44;--ok:#16a34a;--warn:#f59e0b;--bad:#dc2626;--info:#2563eb;--r:14px;--sh:0 1px 2px rgba(16,24,20,.06),0 4px 16px rgba(16,24,20,.06);--font:'Inter','Segoe UI',system-ui,-apple-system,Roboto,sans-serif;--tb:58px}
[data-theme="ocean"]{--pri:#0e5a8a;--pri-d:#0a3f61;--pri-l:#e5f1f9;--acc:#f2994a;--sb:#0b2338;--sb-act:#164b73}
[data-theme="terracotta"]{--pri:#b5532c;--pri-d:#8a3d1f;--pri-l:#fbeee7;--acc:#2f7d6d;--sb:#2b1a14;--sb-act:#6b3420}
[data-theme="slate"]{--pri:#334155;--pri-d:#1e293b;--pri-l:#eef1f5;--acc:#0ea5e9;--sb:#111827;--sb-act:#374151}
[data-theme="royal"]{--pri:#5b3fb8;--pri-d:#43308a;--pri-l:#efebfb;--acc:#e0a526;--sb:#1d1442;--sb-act:#3b2a7d}
[data-theme="sawit"]{--pri:#7a6a12;--pri-d:#5a4e0c;--pri-l:#f6f3e1;--acc:#c2410c;--sb:#22200d;--sb-act:#4d4510}
[data-mode="dark"]{--bg:#0d1512;--card:#14201b;--tx:#e4efe9;--mut:#93a6a0;--line:#24352e;--pri-l:#1a2c25;--sh:0 1px 2px rgba(0,0,0,.4),0 6px 20px rgba(0,0,0,.35)}
*{box-sizing:border-box}[hidden]{display:none!important}html,body{margin:0;height:100%}
body{font-family:var(--font);background:var(--bg);color:var(--tx);font-size:14px;line-height:1.45;-webkit-font-smoothing:antialiased;overscroll-behavior-y:contain}
a{color:var(--pri)}h1,h2,h3,h4{margin:0 0 .5em;line-height:1.25}h2{font-size:1.2rem}h3{font-size:1.02rem}
.hidden{display:none!important}.muted{color:var(--mut)}.small{font-size:12px}.mono{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12.5px}
.splash{position:fixed;inset:0;display:grid;place-items:center;background:linear-gradient(135deg,var(--sb),var(--pri));color:#fff;z-index:100;transition:opacity .25s}
.splash-in{text-align:center}.splash-logo{font-size:54px}.splash-t{letter-spacing:.2em;font-weight:700;margin:6px 0 14px}
.spinner{width:28px;height:28px;border:3px solid rgba(255,255,255,.3);border-top-color:#fff;border-radius:50%;animation:spin .8s linear infinite;margin:auto}
@keyframes spin{to{transform:rotate(360deg)}}
/* login */
.login{min-height:100%;display:grid;place-items:center;padding:24px;background:radial-gradient(1200px 600px at 10% -10%,var(--pri) 0,transparent 60%),linear-gradient(160deg,var(--sb),#08140f)}
.login-card{width:min(420px,100%);background:var(--card);border-radius:20px;padding:28px 26px;box-shadow:0 20px 60px rgba(0,0,0,.35)}
.login-brand{text-align:center;margin-bottom:18px}.login-brand h1{font-size:1.15rem;margin:10px 0 2px}
.login-logo{width:76px;height:76px;border-radius:18px;object-fit:contain;background:var(--pri-l);display:inline-grid;place-items:center;font-size:40px;cursor:zoom-in}
.login form label{display:block;margin:10px 0;font-weight:600;font-size:13px}.login form input:not([type=checkbox]){margin-top:5px}
.pw-wrap{position:relative;display:block}.pw-eye{position:absolute;right:6px;top:50%;transform:translateY(-35%);border:0;background:none;cursor:pointer;font-size:16px}
.chk{display:flex!important;gap:8px;align-items:center;font-weight:500!important}
.login-msg{min-height:20px;color:var(--bad);font-size:13px;margin-top:8px;text-align:center}
.login-foot{text-align:center;font-size:12px;color:var(--mut);margin-top:14px}
/* form */
input,select,textarea{width:100%;font:inherit;color:var(--tx);background:var(--card);border:1px solid var(--line);border-radius:10px;padding:9px 11px;outline:none;transition:border .15s,box-shadow .15s}
input:focus,select:focus,textarea:focus{border-color:var(--pri);box-shadow:0 0 0 3px color-mix(in srgb,var(--pri) 18%,transparent)}
input[type=checkbox],input[type=radio]{width:auto}textarea{min-height:76px;resize:vertical}
input[type=color]{padding:2px;height:38px}
.btn{display:inline-flex;align-items:center;gap:6px;justify-content:center;font:inherit;font-weight:600;border:1px solid var(--line);background:var(--card);color:var(--tx);padding:8px 14px;border-radius:10px;cursor:pointer;white-space:nowrap;transition:transform .05s,background .15s;min-height:38px}
.btn:hover{background:var(--pri-l)}.btn:active{transform:translateY(1px)}.btn[disabled]{opacity:.55;cursor:not-allowed}
.btn.primary{background:var(--pri);border-color:var(--pri);color:#fff}.btn.primary:hover{background:var(--pri-d)}
.btn.danger{color:var(--bad);border-color:color-mix(in srgb,var(--bad) 40%,transparent)}.btn.danger.solid{background:var(--bad);color:#fff}
.btn.ok{background:var(--ok);border-color:var(--ok);color:#fff}.btn.sm{padding:4px 9px;min-height:30px;font-size:12.5px;border-radius:8px}.btn.block{width:100%}
.btn.ghost{border-color:transparent;background:transparent}
.icon-btn{border:0;background:transparent;color:var(--tx);font-size:19px;width:40px;height:40px;border-radius:10px;cursor:pointer;position:relative}
.icon-btn:hover{background:var(--pri-l)}.icon-btn.spin{animation:spin 1s linear infinite}
.dot-count{position:absolute;top:2px;right:0;background:var(--bad);color:#fff;font-size:10px;border-radius:9px;padding:1px 5px;font-weight:700}
.fgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:10px 14px}
.fgrid label{display:flex;flex-direction:column;gap:4px;font-size:12.5px;font-weight:600;color:var(--mut)}
.fgrid label.full{grid-column:1/-1}.fgrid label .req{color:var(--bad)}
.fgrid label.chk{flex-direction:row;align-items:center;color:var(--tx)}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.row.end{justify-content:flex-end}.row.sb{justify-content:space-between}.grow{flex:1}
/* shell */
.app{display:flex;min-height:100%;max-width:100vw;overflow-x:clip}
.sidebar{width:252px;background:var(--sb);color:var(--sb-tx);position:fixed;inset:0 auto 0 0;display:flex;flex-direction:column;z-index:40;transition:transform .2s}
.sb-head{display:flex;gap:10px;align-items:center;padding:16px 14px;border-bottom:1px solid rgba(255,255,255,.08)}
.sb-logo{width:42px;height:42px;border-radius:11px;object-fit:contain;background:rgba(255,255,255,.1);display:grid;place-items:center;font-size:22px;cursor:zoom-in;flex:none}
.sb-title{font-weight:800;font-size:13.5px;letter-spacing:.02em;color:#fff;line-height:1.2}.sb-sub{font-size:11px;opacity:.7}
.nav{flex:1;overflow:auto;padding:8px}
.nav .grp{font-size:10.5px;text-transform:uppercase;letter-spacing:.1em;opacity:.55;margin:12px 10px 4px}
.nav a{display:flex;align-items:center;gap:10px;color:var(--sb-tx);text-decoration:none;padding:8px 10px;border-radius:9px;font-weight:500;font-size:13.5px}
.nav a:hover{background:rgba(255,255,255,.06)}.nav a.act{background:var(--sb-act);color:#fff;font-weight:600}
.nav a i{font-style:normal;width:20px;text-align:center}
.sb-foot{padding:10px 14px;font-size:11px;opacity:.6;border-top:1px solid rgba(255,255,255,.08)}
.main{flex:1;margin-left:252px;min-width:0;display:flex;flex-direction:column}
.topbar{height:var(--tb);position:sticky;top:0;z-index:30;background:color-mix(in srgb,var(--card) 92%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:6px;padding:0 12px}
#menuBtn{display:none}.tb-title{flex:1;min-width:0;display:flex;flex-direction:column;font-weight:700;font-size:15px}.tb-title small{font-weight:500;color:var(--mut);font-size:11.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.proj-sel{width:auto;max-width:230px;padding:6px 9px;font-size:13px}
.net-badge{font-size:12px;color:var(--ok);padding:0 4px}.net-badge.off{color:var(--bad)}
.avatar-btn{width:38px;height:38px;border-radius:50%;border:2px solid var(--pri);background:var(--pri-l);padding:0;cursor:pointer;overflow:hidden;font-weight:700;color:var(--pri)}
.avatar-btn img{width:100%;height:100%;object-fit:cover}
.lic-banner{background:#fff4d6;color:#7a5200;padding:7px 14px;font-size:12.5px;border-bottom:1px solid #f3d98b}
[data-mode="dark"] .lic-banner{background:#3a2e10;color:#f6d77d;border-color:#5a4512}
.view{padding:16px;max-width:1500px;width:100%;margin:0 auto;outline:none;animation:fade .14s ease-out}
@keyframes fade{from{opacity:.4;transform:translateY(3px)}to{opacity:1;transform:none}}
.bottom-nav{display:none}
.sb-backdrop{display:none}
/* cards */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh);padding:14px 16px;margin-bottom:14px}
.card h3{display:flex;align-items:center;gap:8px}
.card-h{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:10px;flex-wrap:wrap}.card-h h3{margin:0}
.grid{display:grid;gap:14px}.g-side{grid-template-columns:minmax(0,370px) minmax(0,1fr)}.g2{grid-template-columns:repeat(2,minmax(0,1fr))}.g3{grid-template-columns:repeat(3,minmax(0,1fr))}.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.kpis{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:12px;margin-bottom:14px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;box-shadow:var(--sh);position:relative;overflow:hidden}
.kpi::after{content:"";position:absolute;inset:auto -20px -30px auto;width:80px;height:80px;border-radius:50%;background:var(--pri-l)}
.kpi .k-l{font-size:11.5px;color:var(--mut);font-weight:600;text-transform:uppercase;letter-spacing:.04em}
.kpi .k-v{font-size:1.45rem;font-weight:800;margin-top:2px;position:relative;z-index:1}.kpi .k-s{font-size:11.5px;color:var(--mut);position:relative;z-index:1}
.bar{height:8px;background:var(--line);border-radius:6px;overflow:hidden}.bar>i{display:block;height:100%;background:var(--pri);border-radius:6px}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:12px;overflow-x:auto;scrollbar-width:none}
.tabs button{border:0;background:none;padding:9px 13px;font:inherit;font-weight:600;color:var(--mut);cursor:pointer;border-bottom:2px solid transparent;white-space:nowrap}
.tabs button.act{color:var(--pri);border-bottom-color:var(--pri)}
/* tables */
.tbl-wrap{overflow:auto;border:1px solid var(--line);border-radius:12px;max-height:68vh}
table.tbl{width:100%;border-collapse:collapse;font-size:13px}
.tbl th{position:sticky;top:0;background:var(--pri-l);color:var(--tx);text-align:left;font-weight:700;padding:8px 10px;white-space:nowrap;cursor:pointer;z-index:1;font-size:12px}
.tbl td{padding:7px 10px;border-top:1px solid var(--line);vertical-align:top}.tbl tr:hover td{background:color-mix(in srgb,var(--pri-l) 50%,transparent)}
.tbl td.num,.tbl th.num{text-align:right;font-variant-numeric:tabular-nums}
.tbl-tools{display:flex;gap:8px;align-items:center;margin-bottom:8px;flex-wrap:wrap}.tbl-tools input{max-width:260px}
.pager{display:flex;gap:6px;align-items:center;justify-content:flex-end;margin-top:8px;font-size:12px;color:var(--mut)}
.badge{display:inline-block;padding:2px 8px;border-radius:20px;font-size:11px;font-weight:700;background:var(--line);color:var(--tx);white-space:nowrap}
.b-ok{background:#dcfce7;color:#166534}.b-bad{background:#fee2e2;color:#991b1b}.b-warn{background:#fef3c7;color:#92400e}.b-info{background:#dbeafe;color:#1e40af}.b-mut{background:#e2e8f0;color:#334155}.b-pur{background:#ede9fe;color:#5b21b6}.b-dk{background:#065f46;color:#fff}.b-pink{background:#fce7f3;color:#9d174d}
[data-mode="dark"] .badge{filter:brightness(.92)}
.empty{text-align:center;padding:30px 10px;color:var(--mut)}.empty b{display:block;font-size:30px;margin-bottom:6px}
.legend-dot{display:inline-block;width:11px;height:11px;border-radius:50%;margin-right:6px;vertical-align:-1px;border:1px solid rgba(0,0,0,.25)}
/* modal */
.modal-bg{position:fixed;inset:0;background:rgba(5,15,10,.5);z-index:60;display:flex;align-items:center;justify-content:center;padding:16px;animation:fade .12s}
.modal{background:var(--card);border-radius:18px;width:min(640px,100%);max-height:92vh;display:flex;flex-direction:column;overflow:hidden;box-shadow:0 24px 70px rgba(0,0,0,.35)}
.modal.wide{width:min(1100px,100%)}.modal.full{width:100%;height:100%;max-height:100%;border-radius:0}
.modal-h{display:flex;justify-content:space-between;align-items:center;padding:14px 18px;border-bottom:1px solid var(--line)}.modal-h h3{margin:0}
.modal-b{padding:16px 18px;overflow:auto;flex:1;min-height:0;overscroll-behavior:contain}.modal-f{padding:12px 18px;border-top:1px solid var(--line);display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
.toasts{position:fixed;right:14px;bottom:14px;z-index:90;pointer-events:none;display:flex;flex-direction:column;gap:8px;max-width:min(380px,calc(100% - 28px))}
.toast{background:#13241d;color:#fff;padding:10px 14px;border-radius:12px;box-shadow:0 10px 30px rgba(0,0,0,.25);font-size:13px;animation:fade .15s;border-left:4px solid var(--ok)}
.toast.err{border-left-color:var(--bad)}.toast.warn{border-left-color:var(--warn)}
/* lightbox (zoom) */
.lightbox{position:fixed;inset:0;background:rgba(0,0,0,.92);z-index:95;touch-action:none}
.lb-stage{position:absolute;inset:0;overflow:hidden;display:grid;place-items:center}
.lb-stage img{max-width:92vw;max-height:84vh;transform-origin:center;user-select:none;-webkit-user-drag:none;cursor:grab;transition:transform .05s}
.lb-bar{position:absolute;bottom:18px;left:50%;transform:translateX(-50%);display:flex;gap:8px}
.lb-bar button{width:46px;height:46px;border-radius:50%;border:0;background:rgba(255,255,255,.16);color:#fff;font-size:20px;cursor:pointer}
.zoomable{cursor:zoom-in}
/* map */
.map{height:62vh;min-height:360px;border-radius:12px;border:1px solid var(--line);z-index:1}
.map.tall{height:calc(100vh - 190px)}
.map-tools{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px}
.leaflet-container{font-family:var(--font)}
.map-coord{background:rgba(255,255,255,.92);padding:3px 8px;border-radius:6px;font:12px ui-monospace,monospace;color:#111}
.map-legend{background:rgba(255,255,255,.95);padding:8px 10px;border-radius:8px;font-size:12px;color:#111;max-height:40vh;overflow:auto;box-shadow:0 2px 8px rgba(0,0,0,.2)}
.map-legend .li{display:flex;align-items:center;gap:6px;margin:2px 0}
.nav-arrow{width:150px;height:150px;margin:auto;display:block;transition:transform .3s}
.navbox{text-align:center}.navbox .dist{font-size:2.3rem;font-weight:800}.navbox .sub{color:var(--mut)}
.chip{display:inline-flex;gap:4px;align-items:center;background:var(--pri-l);color:var(--pri-d);border-radius:20px;padding:3px 10px;font-size:12px;font-weight:600}
[data-mode="dark"] .chip{color:var(--sb-tx)}
.gantt{overflow:auto;border:1px solid var(--line);border-radius:12px}
.gantt svg text{font-family:var(--font)}
.chart svg{width:100%;height:auto}.chart text{fill:var(--mut);font-size:11px}
.photo-thumb{width:64px;height:64px;object-fit:cover;border-radius:8px;border:1px solid var(--line);cursor:zoom-in}
.avatar-lg{width:110px;height:110px;border-radius:50%;object-fit:cover;border:3px solid var(--pri);cursor:zoom-in;background:var(--pri-l);display:grid;place-items:center;font-size:40px;font-weight:800;color:var(--pri)}
.legal h4{margin-top:14px}.legal p,.legal li{font-size:13px}
.flag-ok{color:var(--ok)}.flag-bad{color:var(--bad)}.flag-w{color:var(--warn)}
.skel{background:linear-gradient(90deg,var(--line),var(--pri-l),var(--line));background-size:200% 100%;animation:sk 1s infinite;border-radius:8px;height:14px;margin:8px 0}
@keyframes sk{to{background-position:-200% 0}}
.theme-sw{width:36px;height:36px;border-radius:50%;border:3px solid transparent;cursor:pointer}.theme-sw.act{border-color:var(--tx)}
/* responsive */
@media (max-width:1100px){.g4{grid-template-columns:repeat(2,minmax(0,1fr))}.g3{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:860px){
  .sidebar{transform:translateX(-100%)}.app.sb-open .sidebar{transform:none}
  .app.sb-open .sb-backdrop{display:block;position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:35}
  .main{margin-left:0}#menuBtn{display:inline-block}.view{padding:12px 10px 84px}
  .g2,.g3,.g4,.g-side{grid-template-columns:1fr}.proj-sel{max-width:130px}
  .bottom-nav{display:flex;position:fixed;bottom:0;left:0;right:0;height:62px;background:var(--card);border-top:1px solid var(--line);z-index:30;padding-bottom:env(safe-area-inset-bottom)}
  .bottom-nav a{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:10.5px;color:var(--mut);text-decoration:none;gap:2px;font-weight:600}
  .bottom-nav a i{font-style:normal;font-size:19px}.bottom-nav a.act{color:var(--pri)}
  .modal-bg{padding:0;align-items:flex-end}.modal{border-radius:18px 18px 0 0;max-height:94vh}.modal.wide{width:100%}
  .map{height:56vh}.map.tall{height:calc(100vh - 200px)}
  .kpi .k-v{font-size:1.2rem}.toasts{bottom:auto;top:calc(var(--tb) + 8px);right:10px;left:10px;max-width:none}
  #themeBtn,#netBadge{display:none}.tb-title{font-size:14px}.tb-title span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
}
/* ---------- PRINT (peta A4/A3 gaya ArcGIS & laporan) ---------- */
.print-root{display:none}
@media print{
  body *{visibility:hidden}
  .print-root,.print-root *{visibility:visible}
  .print-root{display:block!important;position:absolute;left:0;top:0;width:100%}
  .no-print{display:none!important}
}
.pl{background:#fff;color:#111;font-family:Arial,Helvetica,sans-serif;position:relative;border:1.2mm solid #111;display:grid;grid-template-columns:1fr 62mm;gap:0;overflow:hidden}
.pl-map{position:relative;border-right:.6mm solid #111}.pl-map .leaflet-container{width:100%;height:100%}
.pl-side{display:flex;flex-direction:column;min-height:0;overflow:hidden}.pl-side>.pl-box{flex:none}.pl-side>.pl-legend{flex:1 1 auto!important;min-height:0}
.pl-box{border-bottom:.4mm solid #111;padding:2.5mm 3mm;font-size:8.5pt}
.pl-title{font-size:13pt;font-weight:700;text-align:center;line-height:1.2}.pl-sub{text-align:center;font-size:8.5pt;margin-top:1mm}
.pl-legend .li{display:flex;align-items:center;gap:2mm;margin:1mm 0;font-size:8pt}
.pl-legend.two .lgi{columns:2;column-gap:2mm}.pl-legend.two .li{break-inside:avoid;font-size:7pt}.pl-legend .sw{width:4mm;height:4mm;border:.2mm solid #333;flex:none}
.pl-north{text-align:center;padding:1.5mm 3mm!important}.pl-north svg{width:9mm;height:12mm}
.pl-info td{font-size:7pt;padding:.2mm 1mm;vertical-align:top;line-height:1.15}
.pl-grid-lbl{position:absolute;font-size:6.5pt;background:rgba(255,255,255,.85);padding:0 1mm;z-index:500}
.pl-scale{position:absolute;left:4mm;bottom:4mm;z-index:500;background:rgba(255,255,255,.9);padding:1mm 2mm;font-size:7pt}
.pl-inset{height:26mm;border:.3mm solid #333;margin-top:1mm}
.rep{background:#fff;color:#111;font-family:Arial,Helvetica,sans-serif;font-size:10pt;padding:0}
.rep h1{font-size:16pt;text-align:center}.rep h2{font-size:12.5pt;border-bottom:1px solid #333;padding-bottom:2px;margin-top:14px}
.rep table{width:100%;border-collapse:collapse;margin:6px 0;font-size:8.5pt}.rep th,.rep td{border:1px solid #777;padding:3px 5px}.rep th{background:#e8efe9}
.rep .num{text-align:right}.rep .cover{text-align:center;padding:40mm 10mm;page-break-after:always}
.rep .pb{page-break-before:always}.rep .kv td:first-child{width:38%;font-weight:600}
.rep-head{display:flex;align-items:center;gap:10px;border-bottom:2px solid #111;padding-bottom:6px;margin-bottom:8px}.rep-head img{height:40px}
</style>

  PS.applyBoot = function (boot) {

    var projs = PS.T('Projects');
    var saved = PS_LS.get('ps_pid');

      card('📦 Paket serah terima data', '<p class="small">Ekspor lengkap untuk QGIS/CAD/arsip: koordinat rencana & aktual, as-built, dan batas blok.</p><div class="row"><button class="btn" data-x="xlsx">Koordinat (Excel)</button><button class="btn" data-x="geojson">As-built GeoJSON</button><button class="btn" data-x="kml">As-built KML</button><button class="btn" data-x="dxf">As-built DXF</button><button class="btn" data-x="csv">Koordinat CSV</button></div><p class="small muted">Catatan: GeoPackage tidak dibuat langsung di browser — buka GeoJSON di QGIS lalu "Export › Save Features As › GeoPackage".</p>');
    PS.$$('[data-r]', el).forEach(function (b) { b.onclick = function () { var k = b.getAttribute('data-r'); ui.busy(b, true, 'Menyusun…'); var go = function (a) { PS.rep.run(k, a).catch(ui.err).then(function () { ui.busy(b, false); }); }; if (k === 'daily') ui.prompt('Laporan harian', 'Tanggal (YYYY-MM-DD)', PS.today()).then(function (d) { if (d) go({ date: d }); else ui.busy(b, false); }); else go(); }; });

        if (f === 'kml') PS.rep.kml('asbuilt_' + p.code + '.kml', it.filter(act).map(function (x) { var o = act(x), ll = M.ll(o.e, o.n, z); return { name: x.p.code, lat: ll[0], lon: ll[1], desc: x.status + ' dH=' + o.dH }; }), D.blocks.map(function (bk) { return { name: bk.code, geom: bk.geom }; }));
        if (f === 'dxf') PS.rep.dxf('asbuilt_' + p.code + '.dxf', [{ name: 'BATAS_BLOK', color: 2, lines: [].concat.apply([], D.blocks.map(function (bk) { return [].concat.apply([], PSGeo.geomToUtmPolys(bk.geom, z.zone, z.south).map(function (pp) { return pp.map(function (rg) { return { pts: rg, closed: true }; }); })); })) }, { name: 'RENCANA', color: 3, points: it.map(function (x) { return x.p; }) }, { name: 'AKTUAL', color: 1, labels: true, th: 0.4, points: it.filter(act).map(function (x) { var o = act(x); return { e: Number(o.e), n: Number(o.n), z: o.z, code: x.p.code }; }) }, { name: 'TITIK_KONTROL', color: 5, labels: true, points: D.cps.map(function (c) { return { e: c.e, n: c.n, z: c.z, code: c.code }; }) }]);
